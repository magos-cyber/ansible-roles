---
- name: Install backup tools
  apt:
    name:
      - restic
      - borgbackup
    state: present

- name: Create backup directory
  file:
    path: /var/backups
    state: directory
    mode: '0750'

- name: Configure backup cron
  cron:
    name: "daily backup"
    minute: "0"
    hour: "2"
    job: "/usr/local/bin/backup.sh"
